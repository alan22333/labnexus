services:
  postgres:
    image: postgres:16-alpine
    container_name: labnexus-postgres
    environment:
      POSTGRES_USER: labnexus
      POSTGRES_PASSWORD: labnexus
      POSTGRES_DB: labnexus
    # 宿主 5433 → 容器 5432:避免与本机已装的 Postgres(5432)冲突
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labnexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labnexus-redis
    # 宿主 6380 → 容器 6379:避免与本机已装的 Redis(6379)冲突
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
